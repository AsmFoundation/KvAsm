# =============================================================================
# CI — every test suite KvAsm has, on every push to main and every pull
# request. release.yml calls this same workflow (workflow_call) before it
# publishes anything, so a release can never skip a gate CI enforces.
#
# What runs, in one job (the .NET suite needs the image the first step
# builds, and a job boundary would mean exporting ~2 MB of image for no gain):
#   1. docker build --target runtime: assembles the server and runs
#      `make all test itest` inside the build — unit tests, the bake-off's
#      checking mode, the end-to-end suite (gRPC protocol, concurrency with
#      torn-value detection, streaming, shutdown, snapshots, startup
#      refusals), h2spec 146/146 and the HTTP/2 fuzzer. Any failure fails the
#      image build, so "the image exists" means "every suite passed".
#   2. docker build --target kvbench: the benchmark client and its tests.
#   3. The .NET client suite (unit + Testcontainers integration tests)
#      against the image from step 1, with Docker REQUIRED: a missing Docker
#      fails the job instead of silently skipping the tests that matter.
#   4. The example clients (examples/README.md), Python on grpcio and Go on
#      grpc-go, against the same image, and a check that the committed Go
#      stubs still match kvasm.proto.
#
# Supply chain: every action is pinned to a full commit SHA (the tag in the
# comment is for humans; Dependabot updates both). The token is read-only.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per ref; a newer push to the same pull request cancels the older
  # run, but pushes to main (and release calls) always finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Server, benchmark client and .NET suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # KvAsmServer (the .NET test fixture) starts this tag, i.e. the image
      # this job just built and tested, never a stale local one.
      KVASM_IMAGE: kvasm:ci
      KVASM_REQUIRE_DOCKER: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The toolchain stage compiles nghttp2 from source; the GitHub Actions
      # cache (shared scope with release.yml) keeps that and every unchanged
      # layer between runs. A layer is reused only when its inputs are
      # byte-identical, so a cached test layer is a test that already passed
      # on exactly these sources.
      - name: Build the server image (runs every server test suite)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: kvasm:ci
          load: true
          cache-from: type=gha,scope=kvasm
          cache-to: type=gha,scope=kvasm,mode=max

      # Only the build matters here (its RUN step runs test_kvbench), so the
      # result stays in the build cache instead of being exported.
      - name: Build the benchmark client (runs its unit tests)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: kvbench
          outputs: type=cacheonly
          cache-from: type=gha,scope=kvasm

      - name: Show the image under test
        run: |
          docker image inspect kvasm:ci --format 'id={{.Id}} size={{.Size}} bytes'
          docker image inspect kvasm:ci --format '{{json .Config.Labels}}'

      # The test project targets net8.0 and net10.0: the 8.0 SDK brings the
      # net8.0 runtime, and global.json pins the 10.0 SDK that builds both.
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
          global-json-file: client/dotnet/global.json

      # Run from client/dotnet: its global.json selects the
      # Microsoft.Testing.Platform runner, without which `--solution` is
      # rejected (MSB1001).
      - name: .NET client tests against the image built above
        working-directory: client/dotnet
        run: dotnet test --solution KvAsm.Client.slnx

      # Each example makes every call once and exits non-zero on any answer
      # that differs from the contract (it waits up to 10 s for the server to
      # listen), so a change that breaks plain gRPC clients fails here and
      # not in a user's program. The container runs until the job ends.
      - name: Start the server for the example clients
        run: docker run -d --rm --name kvasm-examples -p 50051:50051 kvasm:ci

      # The runner's Python (3.12) in a venv; grpcio needs 3.10 or later.
      - name: Python client example
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r examples/python/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" examples/python/kvasm_example.py localhost:50051

      # go.mod has no toolchain line, so this installs the release its go
      # line names: the example is proven on the minimum it declares.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum

      - name: Go client example
        working-directory: examples/go
        run: go run . localhost:50051

      # The Go stubs are committed, because a Go build can't run protoc.
      # Regenerating them with the protoc release generate.go names must
      # reproduce them, so kvasm.proto and the stubs can't drift apart. The
      # -I pattern ignores the header lines that only record a generator's
      # version, so a Dependabot bump of protoc-gen-go fails here only when
      # its output really changes. New files, which git diff doesn't show,
      # fail the last line.
      - name: Go stubs match kvasm.proto
        working-directory: examples/go
        env:
          PROTOC_VERSION: "36.2"
          PROTOC_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          PATH="$RUNNER_TEMP/protoc/bin:$PATH" go generate
          git diff --exit-code -I '^//[[:space:]]+(-[[:space:]]+)?protoc(-gen-go(-grpc)?)?[[:space:]]+v[0-9.]+$' -- .
          test -z "$(git ls-files --others --exclude-standard -- .)"
