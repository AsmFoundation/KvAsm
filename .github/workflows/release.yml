# =============================================================================
# Release — publishes one version of KvNode when a tag vX.Y.Z is pushed:
#   1. versions  the tag, the server's VERSION_STR (server/src/main.asm), the
#                client's <Version> and a CHANGELOG.md section must all name
#                the same version, or nothing is published;
#   2. test      the whole CI workflow (ci.yml) on the tagged commit;
#   3. image     ghcr.io/<owner>/kvnode:<version>, :<major.minor> and :latest,
#                linux/amd64 only (the server is x86-64 assembly), with OCI
#                labels, an SBOM and max-mode provenance attestations;
#   4. nuget     KvNode.Client <version> (+ .snupkg symbols) to nuget.org,
#                through nuget.org trusted publishing (no stored API key);
#   5. release   a GitHub release whose notes are the CHANGELOG section,
#                with the packages attached.
# image and nuget run only after every test passed; the GitHub release is
# created only when both published. A failed step can be re-run from the
# Actions page: the NuGet push skips a version that is already there, and the
# image push overwrites the tags with the same, reproducibly built content.
#
# Needs from the repository, all set up on 2026-11-15:
#   - the nuget.org trusted publishing policy "KvNode" (owner elibelash,
#     packages KvNode.*, repository Nucs/KvNode, workflow release.yml,
#     environment nuget). nuget.org trades this job's GitHub OIDC token for a
#     one-hour API key, so no long-lived key exists anywhere;
#   - the GitHub environment "nuget", restricted to tags v*.*.*, so a branch
#     push or a pull request can never obtain such a token;
#   - the repository variable NUGET_USER: the nuget.org profile name, not an
#     e-mail address.
# GHCR uses the built-in GITHUB_TOKEN.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  # Never two publications of the same tag at once; never cancel one midway.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Tag, server, client and changelog agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version lives in two source files (the server logs it, NuGet
      # publishes it); a tag that disagrees with either would publish an image
      # and a package that report a different version than their release.
      - name: Compare the versions
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          server="$(sed -n 's/^%define VERSION_STR[[:space:]]*"\(.*\)"$/\1/p' server/src/main.asm)"
          client="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' client/dotnet/src/KvNode.Client/KvNode.Client.csproj)"
          echo "tag=$tag server=$server client=$client"
          if [ "$tag" != "$server" ] || [ "$tag" != "$client" ]; then
            echo "::error::tag v$tag, server VERSION_STR '$server' and KvNode.Client <Version> '$client' must be equal"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section to use as the release notes"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: CI on the tagged commit
    needs: versions
    uses: ./.github/workflows/ci.yml

  image:
    name: Container image to GHCR
    needs: [versions, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase; the owner's name may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kvnode" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI labels from the git tag: version, revision, created,
      # source and license (the Dockerfile's static labels stay underneath).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=KvNode
            org.opencontainers.image.description=gRPC key-value server written in x86-64 assembly
            org.opencontainers.image.licenses=Apache-2.0

      # The same tested build as CI (the cache makes it a replay of the test
      # job's layers on the same sources), now pushed. The build stage still
      # runs every suite if anything differs, so an untested binary cannot
      # reach the registry.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=kvnode

  nuget:
    name: KvNode.Client to nuget.org
    needs: [versions, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The trusted publishing policy matches the OIDC token's repository,
    # workflow file AND environment: without `environment: nuget` here
    # nuget.org refuses the exchange. The environment only admits tags
    # v*.*.*, which is what keeps every other run away from the token.
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets NuGet/login request the job's OIDC token
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: client/dotnet/global.json

      # CI=true (set by Actions) turns on ContinuousIntegrationBuild
      # (Directory.Build.props): deterministic paths, and Source Link maps
      # the pdb to this commit on GitHub.
      - name: Pack
        working-directory: client/dotnet
        run: dotnet pack src/KvNode.Client/KvNode.Client.csproj --configuration Release --output "$RUNNER_TEMP/packages"

      - name: Keep the packages for the GitHub release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      # Fail with a clear message instead of an opaque token-exchange error
      # when the variable is missing (a fork, or a renamed repository).
      - name: Check the nuget.org user
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::set the repository variable NUGET_USER to the nuget.org profile name (gh variable set NUGET_USER)"
            exit 1
          fi

      # Trusted publishing: GitHub's OIDC token for this job (repository,
      # workflow, environment, ref) becomes a nuget.org API key that expires
      # within an hour and can push only what the policy allows (KvNode.*).
      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # A refused login or push fails this job, so the GitHub release job
      # never runs (the image job runs in parallel and may have pushed
      # already; re-running this job completes the release). The .snupkg
      # next to the package goes to the symbol server with the same command.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    name: GitHub release
    needs: [versions, image, nuget]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      # The notes are the version's CHANGELOG section, without its heading
      # (the release title carries the version), up to the next version.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "KvNode $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/packages/*
