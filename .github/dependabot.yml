# Keeps the pinned GitHub Actions (full commit SHAs, version in a comment)
# and the .NET client's NuGet dependencies current. One pull request per
# ecosystem per week: grouped updates keep the Grpc.* packages, which must
# move in lockstep (Directory.Packages.props), in one change that CI tests
# as a whole. The Dockerfile's base image is chosen through a build ARG
# (DEBIAN_RELEASE), which Dependabot cannot follow; nghttp2 and h2spec are
# pinned by SHA-256 and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /client/dotnet
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
